[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-http-server"
dynamic = ["version"]
description = "simple fastapi server to host OpenVoiceOS stt plugins as a service"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.9"

keywords = [
    "plugin",
    "STT",
    "OVOS",
    "OpenVoiceOS",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
dependencies = [
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "fastapi~=0.95",
    "uvicorn~=0.22",
    "ovos-utils>=0.0.32,<1.0.0",
]

[project.optional-dependencies]
audio = ["pydub"]
test = ["pytest", "httpx", "pytest-cov", "python-multipart", "requests", "uvicorn", "websockets", "SpeechRecognition", "ovos-stt-plugin-chromium"]
mcp = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-stt-http-server"
Repository = "https://github.com/OpenVoiceOS/ovos-stt-http-server"

[project.scripts]
ovos-stt-server = "ovos_stt_http_server.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ovos_stt_http_server = ["audio/*"]

[tool.setuptools.packages.find]
include = ["ovos_stt_http_server*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_stt_http_server.version.__version__"}

[tool.coverage.run]
source = ["ovos_stt_http_server"]
omit = [
    "test/*",
    "*/proto/*_pb2.py",
    "*/proto/*_pb2_grpc.py",
]
